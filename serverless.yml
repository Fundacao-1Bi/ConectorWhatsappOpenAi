service: conector-exemplo
frameworkVersion: '3.40.0'
configValidationMode: error

custom:
  esbuild:
    bundle: true
    minify: false
    target: node22
    exclude: []
  prune:
    automatic: true
    number: 3
  enterprise:
    collectLambdaLogs: false

provider:
  name: aws
  runtime: nodejs22.x
  stage: prod
  region: us-east-1
  environment: ${file(serverless/environment.yml)}
  tracing:
    apiGateway: false
    lambda: false
  iamRoleStatements: ${file(serverless/iamRoles.yml)}
  deploymentBucket:
    name: aprendizap-serverless-deployments
  apiGateway:
    apiKeys:
      - ${opt:stage, self:provider.stage}-connector-api-key

resources:
  ### DYNAMODB
  - ${file(serverless/resources.yml)}

functions:
  # Handlers
  - ${file(serverless/functions.yml)}

plugins:
  - ./plugins/node22-runtime.js
  - serverless-esbuild
  - serverless-prune-plugin
