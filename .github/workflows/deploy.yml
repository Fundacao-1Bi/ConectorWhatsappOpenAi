name: Serverless

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Extract branch name
        if: github.event_name != 'pull_request'
        shell: bash
        run: echo "BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/})" >> "$GITHUB_ENV"
        id: extract_branch

      - name: Set environment prod
        if: ${{ env.BRANCH_NAME == 'main' }}
        run: echo "ENV=prod" >> "$GITHUB_ENV"

      - name: Set environment dev
        if: ${{ env.BRANCH_NAME == 'develop' }}
        run: echo "ENV=develop" >> "$GITHUB_ENV"

      - name: Checkout repo
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate before deployment
        run: npm run validate
      - name: Configure AWS Credentials Action For GitHub Actions
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy serverless
        run: npx --no-install serverless deploy --stage ${{ env.ENV }} --verbose --conceal
